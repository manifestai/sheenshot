<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheenshot</title>
<link rel="alternate" hreflang="pt-BR" href="/pt/">
<link rel="alternate" hreflang="en" href="/en/">
<link rel="alternate" hreflang="x-default" href="/en/">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<meta name="robots" content="noindex">
<script>
  // Escolha salva > idioma do navegador. Português vai para /pt/; o resto, para /en/.
  (function () {
    var lang = null;
    try { lang = localStorage.getItem("sheenshot-lang"); } catch (e) {}
    if (!lang) {
      var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
      lang = String(list[0] || "en").toLowerCase().indexOf("pt") === 0 ? "pt" : "en";
    }
    location.replace("/" + (lang === "pt" ? "pt" : "en") + "/" + location.hash);
  })();
</script>

</head>
